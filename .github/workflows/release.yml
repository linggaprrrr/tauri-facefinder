name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Windows only: every kiosk runs Windows. The old macOS matrix entries ran in
  # parallel and all rewrote the release's latest.json (the updater manifest);
  # in v1.8.1 they raced, the Windows job's write 404'd, and the manifest
  # shipped without a Windows entry — so no kiosk would have auto-updated.
  # One job, one writer. For a Mac build, run `npm run tauri build` locally.
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Face Finder ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: false
          prerelease: false
