<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Sample photo for editor demo">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="960" cy="150" r="95" fill="url(#sun)" opacity="0.95"/>
  <path d="M0 510 C160 440 270 470 390 390 C510 310 610 350 720 280 C850 195 970 250 1200 145 L1200 800 L0 800 Z" fill="#312e81" opacity="0.75"/>
  <path d="M0 565 C170 500 315 525 455 445 C600 360 710 405 835 330 C975 245 1065 305 1200 238 L1200 800 L0 800 Z" fill="#4338ca" opacity="0.72"/>
  <path d="M0 610 C210 560 335 590 520 520 C700 450 790 510 960 455 C1070 420 1140 415 1200 430 L1200 800 L0 800 Z" fill="url(#ground)"/>

  <g filter="url(#shadow)">
    <rect x="382" y="246" width="360" height="430" rx="180" fill="#f8d7bd"/>
    <circle cx="480" cy="345" r="118" fill="#1f2937"/>
    <circle cx="640" cy="335" r="128" fill="#1f2937"/>
    <rect x="430" y="255" width="265" height="210" rx="105" fill="#1f2937"/>
    <ellipse cx="560" cy="446" rx="155" ry="176" fill="#f8d7bd"/>
    <circle cx="505" cy="430" r="13" fill="#111827"/>
    <circle cx="615" cy="430" r="13" fill="#111827"/>
    <path d="M560 452 L535 512 L585 512 Z" fill="#e0a98a" opacity="0.85"/>
    <path d="M500 560 C535 592 590 592 625 560" fill="none" stroke="#9f1239" stroke-width="14" stroke-linecap="round"/>
    <path d="M355 770 C380 650 455 595 560 595 C670 595 745 650 770 770 Z" fill="#017dc5"/>
    <path d="M420 665 C505 720 615 720 700 665" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g opacity="0.9">
    <rect x="72" y="64" width="270" height="78" rx="39" fill="rgba(255,255,255,0.28)"/>
    <text x="207" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Editor Demo</text>
  </g>
</svg>
